<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essencialista | Fé, Ciência e Vida Cristã</title>
    
    <meta name="theme-color" content="#000000">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    
    <style>
        html { scroll-behavior: smooth; }
        #progress-container { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: transparent; z-index: 9999; }
        #progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f97316, #ea580c); transition: width 0.1s; }
        header.scrolled { background: rgba(0, 0, 0, 0.9) !important; padding: 0.5rem 1rem !important; }
        
        .youtube-card { transition: transform 0.3s ease; opacity: 0; }
        .youtube-card:hover { transform: translateY(-5px); }
        
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .animate-fade-in { animation: fadeIn 0.6s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        body.dark { background-color: #121212; color: #e5e7eb; }
        .dark .bg-white { background-color: #1e1e1e !important; color: #f3f4f6; }
        .dark .text-gray-900 { color: #ffffff !important; }
        .dark .filter-btn:not(.bg-black) { background-color: #333; color: #ccc; }

        /* Ajuste para rolagem suave de filtros no mobile */
        #filter-buttons::-webkit-scrollbar { display: none; }
        #filter-buttons { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">
    <div id="progress-container"><div id="progress-bar"></div></div>

    <header class="bg-black text-white p-6 shadow-md sticky top-0 z-50 transition-all">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="home.html"><img src="images/sem-bg-black.webp" alt="Logo" class="h-10"></a>
                <h1 class="text-2xl font-bold">Essencialista</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="darkModeBtn" aria-label="Alternar modo escuro" class="p-2 rounded-full hover:bg-white/10 min-w-[44px] min-h-[44px]">
                    <i id="darkIcon" class="fas fa-moon text-xl"></i>
                </button>
                <button id="mobileMenuBtn" aria-label="Abrir menu" class="md:hidden p-2 min-w-[44px] min-h-[44px]"><i class="fas fa-bars"></i></button>

                <nav id="main-nav" class="hidden md:block">
                    <ul class="flex space-x-6 items-center">
                        <li><a href="home.html" class="hover:text-orange-500 font-bold">Início</a></li>
                        <li><a href="biblioteca.html" class="hover:text-orange-500 font-bold">Biblioteca</a></li>
                        <li><a href="#featured-articles" class="hover:text-orange-500 font-bold">Artigos</a></li>
                        <li><a href="about.html" class="hover:text-orange-500 font-bold">Sobre</a></li>
                        <li><a href="admin.html" class="text-gray-500 hover:text-orange-500" aria-label="Painel Admin"><i class="fas fa-user-shield"></i></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mx-auto mt-8 p-4">
        <section id="featured-articles" class="mb-10">
            <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 border-b-4 border-orange-500 pb-2">
                <h3 class="text-3xl font-bold">Artigos Recentes</h3>
                <div id="filter-buttons" class="flex gap-3 mt-4 md:mt-0 overflow-x-auto pb-2">
                    <button onclick="filtrarArtigos('todos', this)" class="filter-btn bg-black text-white px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap min-h-[40px]">Todos</button>
                    <button onclick="filtrarArtigos('Fé', this)" class="filter-btn bg-gray-200 text-gray-800 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap min-h-[40px]">Fé</button>
                    <button onclick="filtrarArtigos('Ciência', this)" class="filter-btn bg-gray-200 text-gray-800 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap min-h-[40px]">Ciência</button>
                    <button onclick="filtrarArtigos('Profecia', this)" class="filter-btn bg-gray-200 text-gray-800 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap min-h-[40px]">Profecia</button>
                    <button onclick="filtrarArtigos('Vida', this)" class="filter-btn bg-gray-200 text-gray-800 px-5 py-2 rounded-full text-sm font-bold whitespace-nowrap min-h-[40px]">Vida</button>
                </div>
            </div>
            
            <div id="featuredGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </section>

        <section id="comentar" class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-lg mt-20">
            <h3 class="text-2xl font-bold mb-6 text-center">Deixe o seu comentário</h3>
            <form id="commentForm" class="space-y-4">
                <input type="text" id="nome" placeholder="Seu nome" required class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <input type="email" id="email" placeholder="Seu e-mail" required class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                <textarea id="comentario" placeholder="Escreva aqui..." required rows="4" class="w-full border p-3 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none"></textarea>
                <button type="submit" id="btnEnviar" class="bg-black text-white px-6 py-3 rounded-lg hover:bg-orange-500 w-full font-bold uppercase transition min-h-[48px]">Enviar Comentário</button>
            </form>
            <p id="msgStatus" class="mt-3 text-center font-semibold"></p>
        </section>

        <div id="listaComentarios" class="mt-10 max-w-2xl mx-auto mb-20 text-left">
            <h3 class="text-xl font-bold mb-4 border-b-2 border-black">Comentários</h3>
            <div id="loader" class="italic text-gray-500">Carregando comentários...</div>
        </div>
    </main>

    <script>
        // URL do Backend (Google Apps Script)
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzHXvmWVpdmuKtWX3AVBVdH95NWhWhJjqHue1H6_UxZv2bhPM-RcOi_58CNOh3-_37T/exec';
        let todosOsArtigos = [];

        function escapeHTML(str) {
            const p = document.createElement('p');
            p.textContent = str || "";
            return p.innerHTML;
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('animate-fade-in');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        async function carregarArtigos() {
            try {
                const res = await fetch('posts/index.json');
                todosOsArtigos = await res.json();
                todosOsArtigos.sort((a, b) => new Date(b.date || b.mtime).getTime() - new Date(a.date || a.mtime).getTime());
                renderizarGrid(todosOsArtigos);
            } catch (e) { console.error(e); }
        }

        function renderizarGrid(lista) {
            const grid = document.getElementById('featuredGrid');
            grid.innerHTML = '';
            lista.forEach(p => {
                const card = document.createElement('div');
                card.className = 'youtube-card bg-white rounded-xl shadow-md overflow-hidden flex flex-col h-full';
                card.innerHTML = `
                    <a href="${p.href}" class="block group">
                        <div class="relative aspect-video skeleton bg-gray-200">
                            <img src="images/${p.image || 'default.webp'}" class="post-img w-full h-full object-cover transition duration-500 group-hover:scale-110">
                        </div>
                        <div class="p-4 flex-grow text-left">
                            <div class="flex items-center justify-between mb-2">
                                <span class="text-[10px] font-black text-orange-600 uppercase tracking-widest">${escapeHTML(p.category)}</span>
                                <span class="text-xs text-gray-400"><i class="far fa-clock mr-1"></i>${escapeHTML(p.tempoLeitura || '3')} MIN</span>
                            </div>
                            <h4 class="post-title font-bold text-lg text-gray-900 leading-tight group-hover:text-orange-600"></h4>
                        </div>
                    </a>
                    <div class="px-4 pb-4 mt-auto text-right text-xs font-bold text-gray-400 hover:text-orange-500 transition">
                        <a href="#comentar">Comentar</a>
                    </div>`;
                card.querySelector('.post-title').textContent = p.title;
                const img = card.querySelector('.post-img');
                img.onload = () => img.parentElement.classList.remove('skeleton');
                img.onerror = () => img.src = 'images/default.webp';
                grid.appendChild(card);
                observer.observe(card);
            });
        }

        function filtrarArtigos(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-black', 'text-white');
                b.classList.add('bg-gray-200', 'text-gray-800');
            });
            btn.classList.replace('bg-gray-200', 'bg-black');
            btn.classList.add('text-white');
            const catAlvo = cat.toLowerCase();
            renderizarGrid(cat === 'todos' ? todosOsArtigos : todosOsArtigos.filter(a => a.category.toLowerCase() === catAlvo));
        }

        async function carregarComentarios() {
            try {
                const res = await fetch(WEB_APP_URL + '?artigoId=home');
                const dados = await res.json();
                document.getElementById('loader')?.remove();
                if (!Array.isArray(dados)) return;
                const container = document.getElementById('listaComentarios');
                dados.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'bg-white p-4 rounded-lg shadow border-l-4 border-orange-500 mb-4 dark:bg-gray-800';
                    const n = document.createElement('p'); n.className="font-bold text-gray-900 dark:text-white"; n.textContent = c.nome;
                    const co = document.createElement('p'); co.className="text-sm text-gray-700 dark:text-gray-300 mt-1"; co.textContent = c.comentario;
                    div.append(n, co);
                    container.appendChild(div);
                });
            } catch (e) { console.error(e); }
        }

        document.getElementById("commentForm").onsubmit = async function (e) {
            e.preventDefault();
            const btn = document.getElementById("btnEnviar");
            const status = document.getElementById("msgStatus");
            btn.disabled = true; btn.innerText = "Enviando...";
            
            try {
                const payload = {
                    artigoId: "home", // No convert.js isso será dinâmico: "${slug}"
                    nome: document.getElementById("nome").value,
                    email: document.getElementById("email").value,
                    comentario: document.getElementById("comentario").value
                };
                
                // Envio compatível com Google Apps Script
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    mode: 'no-cors', // Evita erro de CORS
                    cache: 'no-cache',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload) 
                });
                
                // Como no-cors não permite ler a resposta, assumimos sucesso se não der erro de rede
                status.className = "mt-3 text-center font-semibold text-green-600";
                status.innerText = "Enviado com sucesso! Aparecerá após a moderação.";
                this.reset();
            } catch (err) { 
                status.className = "mt-3 text-center font-semibold text-red-600";
                status.innerText = "Erro ao conectar com o servidor."; 
            } finally { 
                btn.disabled = false; 
                btn.innerText = "Enviar Comentário"; 
            }
        };

        // Dark Mode Logic
        document.getElementById('darkModeBtn').onclick = () => {
            const isDark = document.body.classList.toggle('dark');
            document.getElementById('darkIcon').classList.replace(isDark ? 'fa-moon' : 'fa-sun', isDark ? 'fa-sun' : 'fa-moon');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        };

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('darkIcon').classList.replace('fa-moon', 'fa-sun');
        }

        window.onscroll = () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            document.getElementById("progress-bar").style.width = (winScroll / height * 100) + "%";
            document.querySelector('header').classList.toggle('scrolled', window.scrollY > 50);
        };

        window.onload = () => { carregarArtigos(); carregarComentarios(); };
        document.getElementById('mobileMenuBtn').onclick = () => document.getElementById('main-nav').classList.toggle('hidden');
    </script>
</body>
</html>
