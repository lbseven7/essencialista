<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Essencialista</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
    <script>
        (function () {
            const btn = document.getElementById('mobileMenuBtn');
            const nav = document.getElementById('main-nav');
            btn?.addEventListener('click', () => {
                const isHidden = nav.classList.contains('hidden');
                if (isHidden) {
                    nav.classList.remove('hidden');
                    nav.classList.add('block');
                    btn.setAttribute('aria-expanded', 'true');
                } else {
                    nav.classList.add('hidden');
                    nav.classList.remove('block');
                    btn.setAttribute('aria-expanded', 'false');
                }
            });
        })();
    </script>
</head>

<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Header -->
    <header class="bg-black text-white p-6 shadow-md">
        <div class="container mx-auto flex items-center relative">
            <div class="flex items-center space-x-3">
                <a href="home.html">
                    <img src="images/sem-bg-black.png" alt="Essencialista Logo" class="h-10">
                </a>
                <a href="home.html">
                    <h1 class="text-2xl font-bold">Essencialista</h1>
                </a>
            </div>

            <div class="ml-auto flex items-center">
                <button id="mobileMenuBtn" class="md:hidden p-2 rounded bg-white/10 hover:bg-white/20"
                        aria-label="Abrir menu" aria-expanded="false">
                    <i class="fas fa-bars"></i>
                </button>

                <nav id="main-nav"
                     class="hidden md:block absolute left-0 right-0 top-full w-full z-50 bg-black text-white p-4 shadow-lg max-h-[60vh] overflow-y-auto
                            md:static md:bg-transparent md:p-0 md:shadow-none md:max-h-none md:overflow-visible">
                    <ul class="flex flex-col space-y-3 md:flex md:flex-row md:space-y-0 md:space-x-6 md:justify-end">
                        <li><a href="home.html" class="hover:text-orange-500">Início</a></li>
                        <li><a href="home.html#featured-articles" class="hover:text-orange-500">Artigos</a></li>
                        <li><a href="about.html" class="hover:text-orange-500">Sobre</a></li>
                        <li><a href="contact.html" class="hover:text-orange-500">Contato</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto mt-20 p-4 max-w-2xl flex justify-center items-center">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
            <h2 class="text-4xl font-bold mb-8 text-center">Contatos</h2>
            <div class="flex justify-center space-x-8 mb-8">
                <a href="https://wa.me/73991182932" target="_blank"
                    class="hover:text-green-500 transition duration-300">
                    <i class="fab fa-whatsapp text-5xl"></i>
                </a>
                <a href="mailto:essencialista7@gmail.com" target="_blank"
                    class="hover:text-gray-500 transition duration-300">
                    <i class="fas fa-envelope text-5xl"></i>
                </a>
                <a href="https://www.youtube.com/watch?v=fGAFJWtKbHw" target="_blank"
                    class="hover:text-red-600 transition duration-300">
                    <i class="fas fa-play text-5xl"></i>
                </a>
            </div>
            <!-- Botão de Voltar -->
            <div class="mt-6 text-center">
                <a href="home.html" class="bg-black text-white px-6 py-1 rounded-full hover:bg-orange-500 transition duration-300">
                    <i class="fas fa-arrow-left"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-black text-white p-4 mx-auto fixed bottom-0 w-full z-50">
        <div class="container mx-auto text-center">
            <p><img src="./images/sem-bg-black.png" alt="Essencialista Logo" class="h-10 inline-block">Essencialista.
                Todos os direitos reservados &copy;lbseven7 2025</p>
        </div>
    </footer>

</body>

</html>
