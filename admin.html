<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Moderação - Essencialista</title>

    <script>
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
            const s = document.createElement('script');
            s.defer = true;
            s.src = '/_vercel/insights/script.js';
            document.head.appendChild(s);
        }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        #card-preview-container {
            width: 100%;
            height: 500px;
            background: #e5e7eb;
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            border: 2px dashed #d1d5db;
        }

        #card-preview {
            width: 1080px;
            height: 1920px;
            background: #000;
            color: #fff;
            position: absolute;
            top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: scale(0.23);
            transform-origin: top center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 3rem;
        }

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60%;
            background: linear-gradient(to top, rgba(0, 0, 0, 1), rgba(0, 0, 0, 0.8), transparent);
        }
        
        /* Animação para o ponto de notificação */
        .ping-green {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .3; }
        }
    </style>
</head>

<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-4xl mx-auto p-4 md:p-8">
        <div class="flex items-center justify-between mb-8 bg-black text-white p-6 rounded-xl shadow-lg">
            <div>
                <h1 class="text-2xl font-bold italic">Essencialista</h1>
                <p id="adminStatus" class="text-gray-400 text-sm transition-all duration-500 flex items-center">
                    Painel Administrativo
                </p>
            </div>
            <a href="index.html" class="text-sm bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg transition">Ver Site</a>
        </div>

        <div id="loginArea" class="bg-white p-6 rounded-xl shadow-md mb-8 text-center">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Área Restrita!</h2>
            <div class="flex flex-col sm:flex-row gap-3 justify-center">
                <input type="password" id="senha" placeholder="Digite a senha admin"
                    class="border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none w-full sm:w-64">
                <button aria-label="acessar painel"
                    class="bg-black text-white px-6 py-3 rounded-lg font-bold hover:bg-orange-600 transition"
                    id="loginBtn" type="button" onclick="carregarAdmin()">
                    Acessar Painel
                </button>
            </div>
            <p id="msgErro" class="text-red-500 mt-3 text-sm hidden">Senha incorreta ou erro de conexão.</p>
        </div>

        <div id="listaAdmin" class="space-y-4 hidden"></div>

        <div id="adminBiblioteca" class="mt-12 hidden">
            <h2 class="text-xl font-bold mb-6 border-b-2 border-orange-500 inline-block">Gerenciar Biblioteca</h2>
            <div class="bg-white p-6 rounded-xl shadow-md mb-8">
                <h3 class="font-bold mb-4 text-sm uppercase tracking-widest text-gray-400">Adicionar Novo Livro</h3>
                <form id="bookForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="bookTitle" placeholder="Título do Livro" required class="border p-2 rounded outline-none focus:ring-2 focus:ring-orange-500">
                    <input type="text" id="bookCat" placeholder="Categoria" required class="border p-2 rounded outline-none focus:ring-2 focus:ring-orange-500">
                    <input type="text" id="bookFile" placeholder="Arquivo (livro.pdf)" required class="border p-2 rounded outline-none focus:ring-2 focus:ring-orange-500">
                    <input type="text" id="bookCover" placeholder="Capa (capa.png)" required class="border p-2 rounded outline-none focus:ring-2 focus:ring-orange-500">
                    <textarea id="bookDesc" placeholder="Descrição curta" required class="border p-2 rounded outline-none focus:ring-2 focus:ring-orange-500 md:col-span-2"></textarea>
                    <button type="submit" class="bg-orange-600 text-white font-bold py-3 rounded hover:bg-black transition md:col-span-2 uppercase text-xs tracking-widest">Adicionar à Planilha</button>
                </form>
                <div id="bookStatus" class="mt-3 text-center text-sm font-bold"></div>
            </div>
        </div>

        <div id="adminCards" class="mt-12 hidden">
            <h2 class="text-xl font-bold mb-6 border-b-2 border-orange-500 inline-block">Gerador de Cards</h2>
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-xl shadow-md h-fit space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Artigo:</label>
                        <select id="card-select" onchange="selecionarPostCard(this.value)" class="w-full border p-3 rounded-lg outline-none font-bold text-sm"></select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="input-cat" placeholder="Categoria" class="border p-2 rounded text-xs uppercase font-black text-orange-600">
                        <input type="color" id="input-color" value="#f97316" class="w-full h-10 p-1 rounded">
                    </div>
                    <textarea id="input-title" rows="3" class="w-full border p-2 rounded font-bold text-lg leading-tight"></textarea>
                    <div class="flex gap-2">
                        <button onclick="baixarCard()" class="flex-grow bg-black text-white px-4 py-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-orange-600 transition">BAIXAR PNG</button>
                        <button onclick="copiarLinkArtigo()" class="bg-gray-100 text-gray-600 px-6 py-4 rounded-xl font-black uppercase text-xs tracking-widest hover:bg-gray-200 transition"><i class="fas fa-link"></i></button>
                    </div>
                </div>

                <div id="card-preview-container">
                    <div id="card-preview">
                        <div class="absolute inset-0 bg-black"></div>
                        <div class="absolute top-0 left-0 right-0 h-[65%] flex items-center justify-center overflow-hidden">
                            <img id="card-img" src="images/sem-bg-black.webp" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-gradient-to-t from-black via-black/20 to-transparent"></div>
                        </div>
                        <div class="gradient-overlay"></div>
                        <div class="relative z-10 w-full px-16 text-center mt-auto pb-32">
                            <div id="card-cat-box" class="inline-flex items-center justify-center bg-orange-600 px-8 py-3 rounded-full mb-8">
                                <span id="card-cat" class="text-3xl font-black uppercase tracking-[0.2em]">CATEGORIA</span>
                            </div>
                            <h1 id="card-title" class="text-8xl font-black leading-tight mb-12 uppercase italic">TÍTULO DO ARTIGO</h1>
                            <div class="flex items-center justify-center space-x-8 border-t-4 border-white/30 pt-16">
                                <div id="qrcode" class="p-4 bg-white rounded-2xl shadow-xl"></div>
                                <div class="text-left">
                                    <p class="text-3xl font-bold text-orange-500 mb-2">LEIA AGORA EM:</p>
                                    <p id="card-url-display" class="text-4xl font-black italic opacity-80">essencialista.vercel.app</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxVuAC4UeWvSORncW4rj5bqquF2ySxMRzP3uwB5CCMIlCKp7yHrNJj3ARv7nrywy2e9/exec';

        async function carregarAdmin() {
            const pw = document.getElementById('senha').value;
            const lista = document.getElementById('listaAdmin');
            const msgErro = document.getElementById('msgErro');
            const btnAcesso = document.querySelector('#loginArea button');
            const statusTxt = document.getElementById('adminStatus');

            if (!pw) {
                msgErro.innerText = "Digite a senha.";
                msgErro.classList.remove('hidden');
                return;
            }

            btnAcesso.disabled = true;
            btnAcesso.innerHTML = '<i class="fas fa-spinner animate-spin"></i>';
            lista.classList.remove('hidden');
            lista.innerHTML = '<div class="text-center py-10"><i class="fas fa-spinner animate-spin text-3xl text-orange-500"></i></div>';

            try {
                const res = await fetch(`${WEB_APP_URL}?mode=admin&pw=${pw}`);
                const dados = await res.json();

                if (dados.error) throw new Error("Senha incorreta.");

                lista.innerHTML = "";
                const temPendentes = dados.some(c => c.status !== 'SIM');

                // ATUALIZAÇÃO DO ÍCONE DE PENDÊNCIA
                if (temPendentes) {
                    statusTxt.classList.replace('text-gray-400', 'text-green-400');
                    statusTxt.classList.add('font-bold');
                    statusTxt.innerHTML = '<i class="fas fa-circle text-[8px] mr-2 ping-green"></i> Pendências Ativas';
                }

                if (dados.length === 0) {
                    lista.innerHTML = '<div class="bg-white p-8 rounded-xl text-center shadow font-bold text-gray-500 uppercase tracking-widest text-xs">Nenhum comentário.</div>';
                } else {
                    dados.reverse().forEach(c => {
                        const card = document.createElement('div');
                        const pendente = c.status !== 'SIM';
                        const numLinha = c.linha || c.row || "";

                        card.className = `bg-white p-6 rounded-xl shadow-md border-l-8 transition-all duration-500 ${pendente ? 'border-orange-500' : 'border-green-500'}`;
                        card.innerHTML = `
                            <div class="flex flex-col md:flex-row justify-between gap-4">
                                <div class="flex-grow">
                                    <div class="flex items-center gap-2 mb-1">
                                        <span class="font-bold text-gray-900 text-lg">${c.nome}</span>
                                        <span class="text-[10px] px-2 py-1 rounded bg-gray-100 text-gray-500 font-bold uppercase">${c.status}</span>
                                    </div>
                                    <p class="text-xs text-gray-400 mb-3">${c.email}</p>
                                    <p class="text-gray-700 bg-gray-50 p-3 rounded-lg border border-gray-100">${c.comentario}</p>
                                </div>
                                <div class="flex md:flex-col gap-2 justify-end">
                                    ${pendente ? `<button onclick="acao('aprovar', '${numLinha}')" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-bold text-sm flex items-center gap-2"><i class="fas fa-check"></i> Aprovar</button>` : ''}
                                    <button onclick="acao('excluir', '${numLinha}')" class="bg-red-50 text-red-600 hover:bg-red-600 hover:text-white px-4 py-2 rounded-lg font-bold text-sm transition flex items-center gap-2"><i class="fas fa-trash-alt"></i> Excluir</button>
                                </div>
                            </div>`;
                        lista.appendChild(card);
                    });
                }

                carregarPostsParaCard();
                document.getElementById('loginArea').classList.add('hidden');
                document.getElementById('adminBiblioteca').classList.remove('hidden');
                document.getElementById('adminCards').classList.remove('hidden');

            } catch (e) {
                lista.classList.add('hidden');
                msgErro.innerText = e.message;
                msgErro.classList.remove('hidden');
                btnAcesso.disabled = false;
                btnAcesso.innerHTML = 'Acessar Painel';
            }
        }

        async function acao(tipo, linha) {
            const pw = document.getElementById('senha').value;
            if (tipo === 'excluir' && !confirm("Apagar comentário?")) return;

            const btn = event.currentTarget;
            const card = btn.closest('.bg-white');
            const lista = document.getElementById('listaAdmin');
            const statusTxt = document.getElementById('adminStatus');

            card.style.opacity = '0.7';
            card.style.pointerEvents = 'none';
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner animate-spin"></i>';

            const url = `${WEB_APP_URL}?action=${tipo}&row=${linha}&pw=${encodeURIComponent(pw)}`;

            try {
                await fetch(url, { mode: 'no-cors' });

                if (tipo === 'aprovar') {
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                    btn.classList.replace('bg-green-600', 'bg-green-500');
                    
                    setTimeout(() => {
                        card.classList.replace('border-orange-500', 'border-green-500');
                        const badge = card.querySelector('span.text-\\[10px\\]');
                        if (badge) {
                            badge.innerText = 'SIM';
                            badge.classList.replace('text-gray-500', 'text-green-700');
                        }
                        btn.remove();
                        card.style.opacity = '1';
                        card.style.pointerEvents = 'auto';
                        atualizarNotificacaoAdmin(); // CHECA SE AINDA TEM LARANJA
                    }, 600);
                } else {
                    card.style.transform = 'scale(0.95)';
                    card.style.opacity = '0';
                    setTimeout(() => {
                        card.remove();
                        if (lista.children.length === 0) {
                            lista.innerHTML = '<div class="bg-white p-8 rounded-xl text-center shadow font-bold text-gray-500 uppercase tracking-widest text-xs">Nenhum comentário.</div>';
                        }
                        atualizarNotificacaoAdmin(); // CHECA SE AINDA TEM LARANJA
                    }, 300);
                }
            } catch (e) {
                btn.innerHTML = originalHTML;
                card.style.opacity = '1';
                card.style.pointerEvents = 'auto';
            }
        }

        function atualizarNotificacaoAdmin() {
            const lista = document.getElementById('listaAdmin');
            const statusTxt = document.getElementById('adminStatus');
            const aindaTemPendentes = lista.querySelectorAll('.border-orange-500').length > 0;

            if (!aindaTemPendentes) {
                statusTxt.classList.replace('text-green-400', 'text-gray-400');
                statusTxt.classList.remove('font-bold');
                statusTxt.innerHTML = 'Painel Administrativo';
            }
        }

        // --- GERADOR DE CARDS ---
        const qrcode = new QRCode(document.getElementById("qrcode"), { width: 180, height: 180 });
        let postsParaCard = [];

        async function carregarPostsParaCard() {
            try {
                const res = await fetch('posts/index.json');
                postsParaCard = await res.json();
                const select = document.getElementById('card-select');
                select.innerHTML = '<option value="">Escolha um artigo...</option>';
                postsParaCard.forEach((p, idx) => {
                    const opt = document.createElement('option');
                    opt.value = idx;
                    opt.textContent = p.title;
                    select.appendChild(opt);
                });
            } catch (e) { console.error("Erro ao carregar posts."); }
        }

        function selecionarPostCard(idx) {
            if (idx === "") return;
            const p = postsParaCard[idx];
            document.getElementById('input-title').value = p.title;
            document.getElementById('input-cat').value = p.category;
            document.getElementById('card-img').src = p.image ? `images/${p.image}` : 'images/default.webp';
            atualizarCard(`https://essencialista.vercel.app/${p.href}`);
        }

        function atualizarCard(link) {
            const title = document.getElementById('input-title').value;
            const cat = document.getElementById('input-cat').value;
            const color = document.getElementById('input-color').value;
            document.getElementById('card-title').innerText = title;
            document.getElementById('card-cat').innerText = cat;
            document.getElementById('card-cat-box').style.backgroundColor = color;
            document.getElementById('card-url-display').innerText = link.replace('https://', '');
            qrcode.clear();
            qrcode.makeCode(link);
        }

        async function baixarCard() {
            const btn = event.currentTarget;
            const card = document.getElementById('card-preview');
            const originalTransform = card.style.transform;
            btn.disabled = true; btn.innerText = "GERANDO...";
            card.style.transform = 'none';
            try {
                const canvas = await html2canvas(card, { useCORS: true, scale: 1 });
                const a = document.createElement('a');
                a.download = `card.png`;
                a.href = canvas.toDataURL();
                a.click();
            } catch (err) { alert("Erro."); }
            card.style.transform = originalTransform;
            btn.disabled = false; btn.innerHTML = "BAIXAR PNG";
        }

        document.getElementById('input-title').addEventListener('input', () => atualizarCard(document.getElementById('card-url-display').innerText));
        document.getElementById('input-cat').addEventListener('input', () => atualizarCard(document.getElementById('card-url-display').innerText));
        document.getElementById('input-color').addEventListener('input', () => atualizarCard(document.getElementById('card-url-display').innerText));

        document.getElementById('bookForm').onsubmit = async function (e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const status = document.getElementById('bookStatus');
            btn.disabled = true; btn.innerText = "ENVIANDO...";
            
            const payload = {
                action: 'adicionarLivro',
                pw: document.getElementById('senha').value,
                titulo: document.getElementById('bookTitle').value,
                descricao: document.getElementById('bookDesc').value,
                categoria: document.getElementById('bookCat').value,
                arquivo: document.getElementById('bookFile').value,
                capa: document.getElementById('bookCover').value
            };

            try {
                await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
                status.className = "mt-3 text-green-600 font-bold";
                status.innerText = "Livro salvo!";
                this.reset();
            } catch (err) { status.innerText = "Erro."; }
            btn.disabled = false; btn.innerText = "ADICIONAR À PLANILHA";
        };
    </script>
</body>
</html>
